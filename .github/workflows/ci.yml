name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev]

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the exact Node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      # Fails if pnpm-lock.yaml doesn't match package.json instead of rewriting it.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
